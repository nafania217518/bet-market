spring:
  application.name: market-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/market_db}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
server.port: 8083
management:
  endpoints.web.exposure.include: health,prometheus
  # Histogram buckets let Grafana and alerts compute p95/p99 latency.
  metrics.distribution.percentiles-histogram.http.server.requests: true
db-scheduler:
  polling-interval: ${SCHEDULER_POLLING_INTERVAL:10s}
  polling-strategy: lock-and-fetch
  polling-strategy-lower-limit-fraction-of-threads: 0.5
  polling-strategy-upper-limit-fraction-of-threads: 1.0
  immediate-execution-enabled: true
  threads: 5
