server:
  port: 8080
spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${USER_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
          issuer-uri: bet-market
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:40}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"
          routes:
            - id: user-auth
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
                - Method=POST
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-auth
            - id: wallet
              uri: ${WALLET_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/wallets/me,/api/wallets/me/ledger
                - Method=GET
              filters:
                - name: CircuitBreaker
                  args:
                    name: wallet
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    exceptions: java.io.IOException
            - id: market-write
              uri: ${MARKET_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/markets,/api/markets/**
                - Method=POST,PATCH,DELETE
              filters:
                - name: CircuitBreaker
                  args:
                    name: market-write
            - id: query
              uri: ${QUERY_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/markets,/api/markets/**,/api/me/bets,/api/leaderboard,/api/users/*/stats
                - Method=GET
              filters:
                - name: CircuitBreaker
                  args:
                    name: query
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    exceptions: java.io.IOException
            - id: bet
              uri: ${BET_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/bets,/api/bets/*
                - Method=POST,DELETE
              filters:
                - name: CircuitBreaker
                  args:
                    name: bet
            - id: notification
              uri: ${NOTIFICATION_SERVICE_URL:ws://localhost:8088}
              predicates:
                - Path=/ws,/ws/**
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    configs:
      default:
        timeout-duration: ${DOWNSTREAM_TIMEOUT:5s}
management:
  endpoints.web.exposure.include: health,prometheus
  # Histogram buckets let Grafana and alerts compute p95/p99 latency.
  metrics.distribution.percentiles-histogram.http.server.requests: true
