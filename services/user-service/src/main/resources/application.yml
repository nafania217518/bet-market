spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  flyway:
    placeholders:
      adminEmail: ${ADMIN_EMAIL:admin@bet-market.local}
      adminPassword: ${ADMIN_PASSWORD:admin-password}
server:
  port: 8081
management:
  endpoints.web.exposure.include: health,prometheus
  # Histogram buckets let Grafana and alerts compute p95/p99 latency.
  metrics.distribution.percentiles-histogram.http.server.requests: true
