name: bet-market

x-service-env: &service-env
  KAFKA_BOOTSTRAP: kafka:29092
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
  DB_USER: app
  DB_PASSWORD: app

services:
  # ---------- infrastructure ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d settlement_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["sh", "/create-topics.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- backend ----------
  # Only the gateway publishes a host port. Services are reachable inside the compose network.
  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    ports: ["8080:8080"]
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      REDIS_HOST: redis
      USER_SERVICE_URL: http://user-service:8081
      WALLET_SERVICE_URL: http://wallet-service:8082
      MARKET_SERVICE_URL: http://market-service:8083
      BET_SERVICE_URL: http://bet-service:8084
      QUERY_SERVICE_URL: http://query-service:8087
      NOTIFICATION_SERVICE_URL: ws://notification-service:8088
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      redis: { condition: service_healthy }
      user-service: { condition: service_healthy }
      wallet-service: { condition: service_healthy }
      market-service: { condition: service_healthy }
      bet-service: { condition: service_healthy }
      query-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }

  user-service:
    build: { context: ., args: { SERVICE: user-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/user_db
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on: &backend-deps
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  wallet-service:
    build: { context: ., args: { SERVICE: wallet-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/wallet_db
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on: *backend-deps

  market-service:
    build: { context: ., args: { SERVICE: market-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/market_db
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on: *backend-deps

  bet-service:
    build: { context: ., args: { SERVICE: bet-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/bet_db
      WALLET_SERVICE_URL: http://wallet-service:8082
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      <<: *backend-deps
      wallet-service: { condition: service_healthy }

  settlement-service:
    build: { context: ., args: { SERVICE: settlement-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/settlement_db
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on: *backend-deps

  # ---------- read side (MongoDB + Redis, no Postgres) ----------
  projection-service:
    build: { context: ., args: { SERVICE: projection-service } }
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      KAFKA_BOOTSTRAP: kafka:29092
      MONGO_URI: mongodb://mongodb:27017/read_db
      REDIS_HOST: redis
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8086/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  query-service:
    build: { context: ., args: { SERVICE: query-service } }
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      MONGO_URI: mongodb://mongodb:27017/read_db
      REDIS_HOST: redis
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8087/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ---------- live updates ----------
  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      KAFKA_BOOTSTRAP: kafka:29092
      USER_SERVICE_URL: http://user-service:8081
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      user-service: { condition: service_healthy }

  # ---------- frontend: nginx serves the SPA and proxies /api and /ws to the gateway ----------
  frontend:
    build: ./frontend
    ports: ["80:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api-gateway: { condition: service_healthy }

  # ---------- observability: Prometheus :9090 (alerts in its UI), Grafana :3000 (anonymous viewer) ----------
  prometheus:
    image: prom/prometheus:v3.14.0
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:13.1.7
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      prometheus: { condition: service_healthy }

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }

  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: postgres
    depends_on:
      postgres: { condition: service_healthy }
