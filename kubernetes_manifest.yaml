          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/settlement_db
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bet-market-secrets, key: DB_PASSWORD } }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8085 }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8085 }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8085 }
