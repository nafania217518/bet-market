# bet-market on a local k3d cluster. Same system as docker-compose.yml, minus the observability stack.
# Images: `docker compose build`, then `k3d image import bet-market-<name>:latest -c <cluster>`.
# Apply: kubectl apply -f kubernetes_manifest.yaml
apiVersion: v1
kind: Namespace
metadata: { name: bet-market }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: bet-market-config, namespace: bet-market }
data:
  KAFKA_BOOTSTRAP: kafka:29092
  REDIS_HOST: redis
  MONGO_URI: mongodb://mongodb:27017/read_db
  DB_USER: app
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
  USER_SERVICE_URL: http://user-service:8081
  WALLET_SERVICE_URL: http://wallet-service:8082
  MARKET_SERVICE_URL: http://market-service:8083
  BET_SERVICE_URL: http://bet-service:8084
  QUERY_SERVICE_URL: http://query-service:8087
  NOTIFICATION_SERVICE_URL: ws://notification-service:8088
  # Debezium Connect relays the outbox; the in-service poller is off. Only the 5 outbox producers read it.
  OUTBOX_RELAY: debezium
---
# Dev values only. Real clusters inject these from a secret store (e.g. External Secrets, Vault).
apiVersion: v1
kind: Secret
metadata: { name: bet-market-secrets, namespace: bet-market }
stringData:
  POSTGRES_PASSWORD: postgres
  DB_PASSWORD: app
  ADMIN_EMAIL: admin@bet-market.local
  ADMIN_PASSWORD: admin-password
---
# Byte-for-byte copies of infra/postgres/init/*.sql.
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: bet-market }
data:
  01-databases.sql: |
    -- One Postgres container, one logical database per service (architecture.md §10, §13.5).
    -- The app user owns each database. Since Postgres 15, GRANT ALL ON DATABASE does not allow
    -- CREATE in the public schema; ownership does.
    CREATE USER app WITH PASSWORD 'app';

    CREATE DATABASE user_db OWNER app;
    CREATE DATABASE wallet_db OWNER app;
    CREATE DATABASE market_db OWNER app;
    CREATE DATABASE bet_db OWNER app;
    CREATE DATABASE settlement_db OWNER app;
  02-debezium.sql: |
    -- Debezium outbox relay (architecture.md §13.5). Needs wal_level=logical (container command).
    -- Insert-only publication: UPDATE/DELETE on tables without a replica identity do not fail,
    -- and outbox purge DELETEs are never streamed.
    -- The slot is created here, before any service writes, so Connect starts from the first event.
    \c user_db
    CREATE PUBLICATION dbz_outbox FOR ALL TABLES WITH (publish = 'insert');
    SELECT pg_create_logical_replication_slot('outbox_user_db', 'pgoutput');
    \c wallet_db
    CREATE PUBLICATION dbz_outbox FOR ALL TABLES WITH (publish = 'insert');
    SELECT pg_create_logical_replication_slot('outbox_wallet_db', 'pgoutput');
    \c market_db
    CREATE PUBLICATION dbz_outbox FOR ALL TABLES WITH (publish = 'insert');
    SELECT pg_create_logical_replication_slot('outbox_market_db', 'pgoutput');
    \c bet_db
    CREATE PUBLICATION dbz_outbox FOR ALL TABLES WITH (publish = 'insert');
    SELECT pg_create_logical_replication_slot('outbox_bet_db', 'pgoutput');
    \c settlement_db
    CREATE PUBLICATION dbz_outbox FOR ALL TABLES WITH (publish = 'insert');
    SELECT pg_create_logical_replication_slot('outbox_settlement_db', 'pgoutput');
---
# Byte-for-byte copy of infra/kafka/create-topics.sh.
apiVersion: v1
kind: ConfigMap
metadata: { name: kafka-create-topics, namespace: bet-market }
data:
  create-topics.sh: |
    #!/bin/sh
    # Creates every Kafka topic from architecture.md §9, plus its .DLT counterpart. Idempotent.
    # Also re-applies retention on existing topics, so a config change reaches old local volumes.
    set -eu

    BOOTSTRAP="${BOOTSTRAP:-kafka:29092}"
    KT=/opt/kafka/bin/kafka-topics.sh
    KC=/opt/kafka/bin/kafka-configs.sh
    DAY=86400000

    # name partitions retention_days ("inf" = keep forever)
    # The Projection Service rebuilds the read model by replaying every topic it consumes
    # (scripts/rebuild-read-model.sh). Those topics keep their events forever; otherwise a replay
    # after the retention period loses data. DLT copies keep 30 days.
    TOPICS="
    user.registered 3 inf
    user.updated 3 7
    wallet.created 3 7
    wallet.reserved 6 3
    wallet.debited 6 inf
    wallet.credited 6 inf
    wallet.released 6 3
    wallet.debit_failed 6 7
    market.created 6 inf
    market.updated 6 inf
    market.frozen 6 inf
    market.ended 6 inf
    market.resolved 6 inf
    market.cancelled 6 inf
    bet.placed 6 inf
    bet.cancelled 6 inf
    bet.failed 6 3
    settlement.started 3 30
    payout.calculated 6 90
    settlement.completed 3 inf
    "

    retention_ms() { [ "$1" = inf ] && echo -1 || echo $(($1 * DAY)); }

    echo "$TOPICS" | while read -r name parts days; do
      [ -z "$name" ] && continue
      for t in "$name" "$name.DLT"; do
        r=$(retention_ms "$days")
        [ "$t" != "$name" ] && [ "$days" = inf ] && r=$((30 * DAY))
        $KT --bootstrap-server "$BOOTSTRAP" --create --if-not-exists --topic "$t" \
          --partitions "$parts" --replication-factor 1 --config "retention.ms=$r"
        $KC --bootstrap-server "$BOOTSTRAP" --alter --entity-type topics --entity-name "$t" \
          --add-config "retention.ms=$r" > /dev/null
      done
    done

    $KT --bootstrap-server "$BOOTSTRAP" --list
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: bet-market }
spec:
  serviceName: postgres
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # The image entrypoint prepends `postgres` to args that start with `-`. Debezium needs logical WAL.
          # max_connections: DB pods at HPA max replicas + 1 surge, x Hikari pool 10, + Debezium (k8s-check.sh).
          args: ["-c", "wal_level=logical", "-c", "max_connections=250"]
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: bet-market-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            # The image runs these scripts once, on an empty volume. This replaces a separate postgres-init Job.
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: [sh, -c, pg_isready -U postgres -d settlement_db] }
            periodSeconds: 5
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: bet-market }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: bet-market }
spec:
  serviceName: kafka
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      # The image turns every KAFKA_* env var into broker config. Service links would inject
      # KAFKA_PORT, KAFKA_SERVICE_HOST etc. for the `kafka` Service and break the broker.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          ports: [{ containerPort: 29092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:29092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:29092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          readinessProbe:
            exec: { command: [sh, -c, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null"] }
            periodSeconds: 5
            timeoutSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: bet-market }
spec:
  selector: { app: kafka }
  ports: [{ port: 29092 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, namespace: bet-market }
spec:
  serviceName: redis
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: bet-market }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mongodb, namespace: bet-market }
spec:
  serviceName: mongodb
  selector: { matchLabels: { app: mongodb } }
  template:
    metadata: { labels: { app: mongodb } }
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports: [{ containerPort: 27017 }]
          volumeMounts:
            - { name: data, mountPath: /data/db }
          readinessProbe:
            exec: { command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"] }
            periodSeconds: 5
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: mongodb, namespace: bet-market }
spec:
  selector: { app: mongodb }
  ports: [{ port: 27017 }]
---
# Creates the topics. Retries until Kafka is up; the script is idempotent.
apiVersion: batch/v1
kind: Job
metadata: { name: kafka-init, namespace: bet-market }
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: kafka-init
          image: apache/kafka:4.3.1
          command: [sh, /scripts/create-topics.sh]
          env: [{ name: BOOTSTRAP, value: "kafka:29092" }]
          volumeMounts: [{ name: scripts, mountPath: /scripts }]
      volumes:
        - name: scripts
          configMap: { name: kafka-create-topics }
---
# Byte-for-byte copies of infra/debezium/*.
apiVersion: v1
kind: ConfigMap
metadata: { name: debezium-connector, namespace: bet-market }
data:
  register.sh: |
    #!/bin/sh
    # Registers one outbox connector per database (PUT is idempotent) and waits until each runs.
    # Needs only curl and sed; the Debezium Connect image has both.
    set -eu
    CONNECT_URL=${CONNECT_URL:-http://connect:8083}
    DBS=${DBS:-"user_db wallet_db market_db bet_db settlement_db"}
    TEMPLATE="$(dirname "$0")/outbox-connector.json"

    i=0
    until curl -fsS "$CONNECT_URL/connectors" > /dev/null 2>&1; do
      i=$((i + 1)); [ "$i" -ge 60 ] && { echo "Connect REST at $CONNECT_URL did not answer in 120 s"; exit 1; }
      sleep 2
    done

    for db in $DBS; do
      sed "s/__DB__/$db/g" "$TEMPLATE" \
        | curl -fsS -X PUT -H 'Content-Type: application/json' --data @- "$CONNECT_URL/connectors/outbox-$db/config" > /dev/null
      echo "registered outbox-$db"
    done

    for db in $DBS; do
      i=0
      # Two RUNNING states: the connector and its single task.
      until [ "$(curl -fsS "$CONNECT_URL/connectors/outbox-$db/status" 2>/dev/null | grep -o '"state":"RUNNING"' | wc -l)" -ge 2 ]; do
        i=$((i + 1)); [ "$i" -ge 30 ] && { echo "outbox-$db not RUNNING after 60 s:"; curl -sS "$CONNECT_URL/connectors/outbox-$db/status"; echo; exit 1; }
        sleep 2
      done
      echo "outbox-$db RUNNING"
    done
  outbox-connector.json: |
    {
      "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
      "plugin.name": "pgoutput",
      "database.hostname": "postgres",
      "database.port": "5432",
      "database.user": "postgres",
      "database.password": "postgres",
      "database.dbname": "__DB__",
      "topic.prefix": "__DB__",
      "slot.name": "outbox___DB__",
      "publication.name": "dbz_outbox",
      "publication.autocreate.mode": "disabled",
      "snapshot.mode": "no_data",
      "table.include.list": "public.outbox_event",
      "tombstones.on.delete": "false",
      "key.converter": "org.apache.kafka.connect.storage.StringConverter",
      "value.converter": "org.apache.kafka.connect.storage.StringConverter",
      "heartbeat.interval.ms": "10000",
      "heartbeat.action.query": "SELECT pg_logical_emit_message(false, 'heartbeat', now()::varchar)",
      "topic.creation.default.replication.factor": "1",
      "topic.creation.default.partitions": "1",
      "predicates": "isOutbox",
      "predicates.isOutbox.type": "org.apache.kafka.connect.transforms.predicates.TopicNameMatches",
      "predicates.isOutbox.pattern": "__DB__\\.public\\.outbox_event",
      "transforms": "outbox",
      "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
      "transforms.outbox.predicate": "isOutbox",
      "transforms.outbox.table.field.event.key": "aggregate_id",
      "transforms.outbox.route.by.field": "event_type",
      "transforms.outbox.route.topic.replacement": "${routedByValue}",
      "transforms.outbox.table.fields.additional.placement": "correlation_id:header:X-Correlation-Id"
    }
---
# Debezium Connect: streams each database's outbox_event table to Kafka (the outbox relay).
apiVersion: apps/v1
kind: Deployment
metadata: { name: connect, namespace: bet-market }
spec:
  replicas: 1
  selector: { matchLabels: { app: connect } }
  template:
    metadata: { labels: { app: connect } }
    spec:
      # The image reads CONNECT_* env vars as worker config; service links would inject CONNECT_PORT etc.
      enableServiceLinks: false
      containers:
        - name: connect
          image: quay.io/debezium/connect:3.7.0.Final
          ports: [{ containerPort: 8083 }]
          env:
            - { name: BOOTSTRAP_SERVERS, value: "kafka:29092" }
            - { name: GROUP_ID, value: connect }
            - { name: CONFIG_STORAGE_TOPIC, value: connect_configs }
            - { name: OFFSET_STORAGE_TOPIC, value: connect_offsets }
            - { name: STATUS_STORAGE_TOPIC, value: connect_statuses }
            - { name: HEAP_OPTS, value: "-Xms256m -Xmx512m" }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /connectors, port: 8083 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: connect, namespace: bet-market }
spec:
  selector: { app: connect }
  ports: [{ port: 8083 }]
---
# Registers one outbox connector per database. Retries until Connect is up; PUT is idempotent.
apiVersion: batch/v1
kind: Job
metadata: { name: connect-init, namespace: bet-market }
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: connect-init
          image: quay.io/debezium/connect:3.7.0.Final
          command: [sh, /debezium/register.sh]
          volumeMounts: [{ name: debezium, mountPath: /debezium }]
      volumes:
        - name: debezium
          configMap: { name: debezium-connector }
---
# 1 replica: the JWT signing key is generated per pod (see JwtIssuer.kt). Replicas would disagree.
apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, namespace: bet-market }
spec:
  replicas: 1
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      containers:
        - name: user-service
          image: bet-market-user-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          envFrom: [{ configMapRef: { name: bet-market-config } }]
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/user_db
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bet-market-secrets, key: DB_PASSWORD } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: bet-market-secrets, key: ADMIN_EMAIL } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: bet-market-secrets, key: ADMIN_PASSWORD } }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: bet-market }
